<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>DevDrop Bluetooth</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/devices.css">

</head>

<body>

<div id="devices-screen">

<header class="devices-header">

<button id="back-btn">←</button>

<h1 id="page-title">

Bluetooth Devices

</h1>

</header>

<!-- Device -->

<main
id="device-screen">

<section id="bluetooth-status">

<div id="bt-icon">

📶

</div>

<div>

<h2 id="bt-text">

Bluetooth Ready

</h2>

<p>

Scan nearby devices

</p>

</div>

</section>

<div class="action-bar">

<button id="scan-btn">

🔍 Scan

</button>

</div>

<div id="device-list">

<div class="loading">

Ready

</div>

</div>

</main>

<!-- Services -->

<main
id="service-screen"
style="display:none;">

<section class="service-status">

<div class="service-icon">

🔗

</div>

<div>

<h2>

Connected

</h2>

<p>

Primary Services

</p>

</div>

</section>

<div id="service-list">

</div>

</main>

<!-- Characteristics -->

<main
id="characteristic-screen"
style="display:none;">

<section class="characteristic-status">

<div class="service-icon">

🔷

</div>

<div>

<h2 id="service-name">

Bluetooth Service

</h2>

<p id="service-uuid">

</p>

</div>

</section>

<div id="characteristic-list">

</div>

</main>

<footer>

DevDrop Bluetooth

</footer>

</div>

<script src="cordova.js"></script>

<script src="api/bluetoothAPI.js"></script>
<script src="api/coreAPI.js"></script>

<script src="js/devices.js"></script>

</body>

</html>
