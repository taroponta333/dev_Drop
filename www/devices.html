<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>DevDrop Bluetooth</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/device.css">

</head>

<body>

<div id="app">

<!-- ==========================
Header
========================== -->

<header class="page-header">

    <button id="back-btn">

        ←

    </button>

    <h1 id="page-title">

        Bluetooth Devices

    </h1>

</header>

<!-- ==========================
Device Screen
========================== -->

<main
id="device-screen">

<section class="status-card">

    <div class="status-icon">

        📶

    </div>

    <div>

        <h2 id="bt-text">

            Bluetooth

        </h2>

        <p>

            Scan nearby devices

        </p>

    </div>

</section>

<div class="action-bar">

    <button id="scan-btn">

        🔍 Scan

    </button>

</div>

<div id="device-list">

    <div class="loading">

        Ready

    </div>

</div>

</main>

<!-- ==========================
Service Screen
========================== -->

<main
id="service-screen"

style="display:none;">

<section class="status-card">

    <div class="status-icon">

        🔗

    </div>

    <div>

        <h2>

            Connected

        </h2>

        <p>

            Service Discovery

        </p>

    </div>

</section>

<div id="service-list">

</div>

</main>

<!-- ==========================
Characteristic Screen
========================== -->

<main
id="characteristic-screen"

style="display:none;">

<section class="status-card">

    <div class="status-icon">

        🔷

    </div>

    <div>

        <h2 id="service-name">

            Service

        </h2>

        <p id="service-uuid">

        </p>

    </div>

</section>

<div id="characteristic-list">

</div>

</main>

<!-- ==========================
Footer
========================== -->

<footer>

    DevDrop Bluetooth

</footer>

</div>

<script src="cordova.js"></script>

<script src="api/bluetoothAPI.js"></script>
<script src="api/coreAPI.js"></script>

<script src="js/devices.js"></script>

</body>

</html>
