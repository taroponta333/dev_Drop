<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1.0,user-scalable=no">

    <title>DevDrop</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="app">

    <!-- Header -->

    <header>

        <h1>DevDrop</h1>

        <p class="version">
            v0.1 Alpha
        </p>

    </header>

    <!-- Home -->

    <main id="home">

        <button id="send-btn" class="menu-btn">

            📤

            <span>Send</span>

        </button>

        <button id="receive-btn" class="menu-btn">

            📥

            <span>Receive</span>

        </button>

        <button id="devices-btn" class="menu-btn">

            🖥️

            <span>Devices</span>

        </button>

        <button id="settings-btn" class="menu-btn">

            ⚙️

            <span>Settings</span>

        </button>

    </main>

    <!-- Footer -->

    <footer>

        DevDrop Core

    </footer>

</div>

<script src="cordova.js"></script>

<script src="js/app.js"></script>

<script src="api/bluetoothAPI.js"></script>
<script src="api/bluetoothPermissionAPI.js"></script>

<script src="api/fileAPI.js"></script>
<script src="api/transferAPI.js"></script>
<script src="api/deviceAPI.js"></script>
<script src="api/historyAPI.js"></script>

<script src="api/coreAPI.js"></script>
</body>

</html>
